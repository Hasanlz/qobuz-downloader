[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qobuz-downloader"
version = "0.1.0"
description = "Saves lossless audio files from a Qobuz subscription to the local disk."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "mutagen>=1.47"]

[project.optional-dependencies]
dev = ["pytest>=8"]
big-playlists = ["spotapi>=0.3", "redis>=5", "pymongo>=4", "websockets>=13"]

[project.scripts]
qobuz-downloader = "qobuz_downloader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qobuz_downloader"]
